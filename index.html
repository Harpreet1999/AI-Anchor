<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Anchor — Data Layer</title>
    <!-- Inline, dependency-free boot skeleton: paints instantly (no
         waiting on the JS bundle, React, or the Google Fonts import in
         index.css) so the first thing a visitor sees is never a blank
         page. Lives OUTSIDE #root (a sibling, not a child) specifically
         so React mounting into #root — instant or not — never touches
         it; its own script below owns its full lifecycle (a real
         0->100% animated fill, a short hold, then a fade), independent
         of how fast the actual app loads underneath it. -->
    <style>
      :root{ --boot-bg:#1B1E1D; --boot-text:#E9E7DE; --boot-dim:#8B9088; --boot-line:#3A403C; }
      @media (prefers-color-scheme: light){
        :root{ --boot-bg:#F1EFE6; --boot-text:#23261F; --boot-dim:#6B6A5C; --boot-line:#C7C2AC; }
      }
      /* min-height, not height — see src/index.css's matching rule for
         why: a fixed height:100% here breaks position:sticky further
         down the page on anything taller than one viewport, and this
         tag is never removed (React only replaces #root's CONTENT on
         mount, not the head), so it was fighting that fix permanently. */
      html, body, #root{ min-height:100vh; }
      body{ margin:0; background:var(--boot-bg); }
      /* Fixed, full-viewport overlay — not part of #root's normal flow —
         so it sits on top of the real app regardless of #root's own
         height/scroll state, and fading it out never has to fight
         anything React is doing underneath. */
      .boot-screen{
        position:fixed; inset:0; z-index:9999; background:var(--boot-bg);
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:14px; font-family:ui-sans-serif, system-ui, sans-serif; color:var(--boot-text);
        opacity:1; transition:opacity 420ms ease;
      }
      .boot-screen.boot-hidden{ opacity:0; pointer-events:none; }
      .boot-mark{
        width:44px; height:44px; border-radius:8px; border:1.5px solid var(--boot-line);
        display:flex; align-items:center; justify-content:center;
        animation:boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-mark svg{ width:22px; height:22px; }
      .boot-title{ font-weight:700; font-size:15px; letter-spacing:0.01em; }
      .boot-sub{ font-family:ui-monospace, "SFMono-Regular", monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--boot-dim); }
      .boot-progress{ width:160px; height:3px; border-radius:2px; background:var(--boot-line); overflow:hidden; }
      .boot-progress-fill{ width:0%; height:100%; background:var(--boot-text); border-radius:2px; }
      .boot-pct{ font-family:ui-monospace, "SFMono-Regular", monospace; font-size:10px; color:var(--boot-dim); }
      @keyframes boot-pulse{ 0%,100%{ opacity:0.5; } 50%{ opacity:1; } }
      @media (prefers-reduced-motion: reduce){ .boot-mark{ animation:none; } .boot-screen{ transition:none; } }
    </style>
  </head>
  <body>
    <div id="boot-screen" class="boot-screen" role="status" aria-label="Loading AI Anchor">
      <div class="boot-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v18M12 3a3 3 0 100 6 3 3 0 000-6zM5 12H3a9 9 0 0018 0h-2M5 12a7 7 0 0014 0" /></svg>
      </div>
      <div class="boot-title">AI Anchor</div>
      <div class="boot-sub">Loading the pipeline…</div>
      <div class="boot-progress"><div class="boot-progress-fill" id="boot-progress-fill"></div></div>
      <div class="boot-pct" id="boot-pct">0%</div>
    </div>
    <div id="root"></div>
    <script>
      // Deliberately NOT tied to real load events — this is a fixed,
      // honest-about-being-simulated ~2s show (real 0->100%, a brief
      // hold, then a fade), shown for that long even on a connection
      // fast enough that the real app would otherwise have appeared
      // instantly. React mounts into #root independently and is simply
      // sitting underneath, already ready, by the time this fades away.
      (function () {
        var DURATION_MS = 1700; // time to reach 100%
        var HOLD_MS = 250; // pause at 100% before fading
        var FADE_MS = 420; // matches the CSS transition above
        var start = null;
        var fill = document.getElementById("boot-progress-fill");
        var label = document.getElementById("boot-pct");
        var screen = document.getElementById("boot-screen");

        function setPct(pct) {
          if (fill) fill.style.width = pct + "%";
          if (label) label.textContent = Math.round(pct) + "%";
        }

        function frame(now) {
          if (start === null) start = now;
          var pct = Math.min(100, ((now - start) / DURATION_MS) * 100);
          setPct(pct);
          if (pct < 100) {
            requestAnimationFrame(frame);
          } else {
            setTimeout(reveal, HOLD_MS);
          }
        }

        function reveal() {
          if (!screen) return;
          screen.classList.add("boot-hidden");
          setTimeout(function () {
            screen.style.display = "none";
          }, FADE_MS);
        }

        requestAnimationFrame(frame);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
